services:
  auth-app:
    build:
      context: ../AuthApp
      target: dev
    container_name: auth-app-dev
    command: ["dotnet", "watch", "--project", "/app/API/API.csproj", "run", "--no-launch-profile", "--", "--urls", "http://0.0.0.0:5271"]
    ports:
      - "5271:5271"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5271
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=exam_app;User Id=sa;password=REMOVED;TrustServerCertificate=True;
 
    volumes:
      - ../AuthApp/AuthenticationApp:/app
    develop:
      watch:
        - action: rebuild
          path: ../AuthApp
          ignore:
            - "**/bin/**"
            - "**/obj/**"
    networks:
      - quiz-network

  quiz-module:
    build:
      context: ../QuizModule
      target: dev
    container_name: quiz-module-dev
    command: ["dotnet", "watch", "--project", "/app/API/API.csproj", "run", "--no-launch-profile", "--", "--urls", "https://0.0.0.0:7290"]
    ports:
      - "7290:7290"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:7290
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/quizmodule.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=REMOVED
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=exam_app;User Id=sa;password=REMOVED;TrustServerCertificate=True;
    volumes:
      - ../QuizModule:/app
      - ./certs:/https:ro
    develop:
      watch:
        - action: rebuild
          path: ../QuizModule
          ignore:
            - "**/bin/**"
            - "**/obj/**"
    networks:
      - quiz-network

  angular-app:
    build:
      context: .
      target: dev
    container_name: learning-app-dev
    command: >
      sh -c "if [ ! -d /app/node_modules/xlsx ]; then npm ci; fi; npm start -- --host 0.0.0.0 --port 3000 --poll 2000"
    depends_on:
      - auth-app
      - quiz-module
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_AUTH_URL=http://auth-app:5271
      - API_QUIZ_URL=http://quiz-module:7290
    volumes:
      - .:/app
      - angular_node_modules:/app/node_modules
    networks:
      - quiz-network

volumes:
  angular_node_modules:

networks:
  quiz-network:
    driver: bridge
