<article class="surface-card test-card">
    <div class="test-card-header">
        <h3 class="test-card-title">{{ test().title }}</h3>
        <span class="meta-pill question-count-pill">{{ test().questionCount }} questions</span>
    </div>

    @if (test().description) {
        <p class="test-card-description">{{ test().description }}</p>
    }

    <div class="test-card-footer">
        <span class="retake-hint">{{ test().isRetakeAllowed ? 'Retakes allowed' : 'Single attempt' }}</span>
        <button class="secondary-button" type="button" (click)="viewAttempts.emit(test().id)">Previous attempts</button>
        <button
            class="primary-button"
            type="button"
            [disabled]="isTakeTestDisabled()"
            [title]="isTakeTestDisabled() ? 'You have already completed this test' : ''"
            (click)="takeTest.emit(test().id)"
        >
            {{ isTakeTestDisabled() ? 'Already completed' : 'Take test' }}
        </button>
    </div>
</article>
